# Moral Decision Dataset (MDD) -> ThirdSpace evaluation vocabulary.
#
# FROZEN v1 — pre-registered. Written BEFORE any scoring run. Constructing or
# adjusting a label mapping after seeing results is a documented source of
# inflated agreement. If this must change, create mdd_v2.yaml and re-run
# everything that used v1; do not edit this file.
#
# Dataset: kracr/moral-decision-dataset, code/MDD/MDD_100.csv (n=100).
#   Labels are produced by the authors' Ethics Scoring Algorithm with human
#   review — treat as SILVER, not gold, and report them as such.
# NOTE: the CSV is cp1252-encoded, not UTF-8 (it carries smart quotes from the
#   original Reddit text).

version: 1
dataset: "kracr/moral-decision-dataset MDD_100.csv"
file: MDD_100.csv
encoding: cp1252
gold_column: "Moral Decision"

# ---------------------------------------------------------------------------
# 1. Gold normalization (1:1, lossless)
# ---------------------------------------------------------------------------
mapping:
  "morally right": morally_right
  "morally wrong": morally_wrong
  "morally grey": morally_grey

prediction_classes: [morally_right, morally_wrong, morally_grey]

# Recorded here so it cannot be quietly forgotten: a constant "morally_grey"
# predictor scores 59% on this set. Accuracy MUST be reported against this
# baseline, with macro-F1 alongside it, or the number is meaningless.
class_balance:
  morally_grey: 59
  morally_wrong: 35
  morally_right: 6
majority_baseline_accuracy: 0.59

# ---------------------------------------------------------------------------
# 2. Frames — which record fields become each agent's cultural frame
# ---------------------------------------------------------------------------
# Mirrors prompts.FRAME_FIELDS["moral_decision"]. The two parties to the moral
# situation ARE the two frames: the one who acted and the one acted upon.
frames:
  main: "Passive Agent"       # the party acted upon
  challenger: "Active Agent"  # the party who acted

# ---------------------------------------------------------------------------
# 3. Dominant conflict type -> predicted label
# ---------------------------------------------------------------------------
# Used by the internal-reasoning arm: predict the moral verdict from the
# mediator's dominant conflict type alone, without reading any document.
conflict_type_to_label:
  factual: unclassifiable          # excluded from scoring; a dataset-quality signal
  procedural: morally_grey         # resolvable once the governing rule is settled
  interpretive: determinate        # right OR wrong — needs the document to disambiguate
  normative: morally_grey          # stable, irreducible value disagreement
  identity_related: morally_wrong  # dignity violation = categorical wrong
  power_related: morally_wrong     # structural distortion = categorical wrong

# 'unclassifiable' and 'determinate' are ROUTING OUTCOMES, not predictions:
#   factual      -> excluded from this arm's accuracy
#   interpretive -> falls through to the final-report classifier
routing_outcomes: [unclassifiable, determinate]

conflict_type_map_notes: |
  This mapping is the design's hypothesis, not an established result, and is
  scored as one. If the internal arm underperforms the final-report arm, the
  finding is that the conflict taxonomy does not by itself determine a moral
  verdict — a real result about the architecture, not a bug to be tuned away.

# ---------------------------------------------------------------------------
# 4. Structured recovery (internal-reasoning classifier)
# ---------------------------------------------------------------------------
# MDD's gold decomposition maps almost 1:1 onto the pipeline's five fundamental
# objects, which is what makes a decomposition-fidelity score possible at all.
# Scored by semantic alignment (embedding similarity), never string equality —
# "redditor who gave advice" and "the person offering guidance" are the same
# referent.
structured_recovery:
  agents: ["Active Agent", "Passive Agent"]
  actions: ["Action"]
  consequences: ["Consequence"]
  context: ["Domain"]
  representations: ["Ethical Principles Upheld", "Ethical Principles Violated"]

notes: |
  Input text: prefer "Original Text" (the source post); fall back to
  "Case Summary" where it is absent (11 of 100 rows). Records built from the
  summary alone carry used_summary_only=true so a runner can exclude them —
  the summary is a much thinner input and may depress scores for reasons that
  have nothing to do with the pipeline.
